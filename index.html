<!doctype html>
<html>
  <head>
    <title>Real-Time Editor</title>
    <meta
      name="description"
      content="A website for making website using HTML, CSS & JS without any editor"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <div class="message hide">
      <span class="icon">&#9989;</span> <span class="text">Copied</span>
    </div>
    <div class="main">
      <div class="buttons">
        <div class="download" onclick="downloadFile()">Download File</div>
        <div class="copy" onclick="generateParams()">Get link</div>
        <div class="console" onclick="goToConsole()">Console</div>
      </div>
      <div class="container">
        <!-- Text area for Html Code  -->
        <textarea
          id="htmlCode"
          placeholder="Type HTML code here"
          spellcheck="false"
          autocapitalize="none"
          oninput="update()"
        ></textarea
        >
        <!-- Text area for Css Code  -->
        <textarea
          id="cssCode"
          placeholder="Type CSS code here"
          spellcheck="false"
          autocapitalize="none"
          oninput="update()"
        ></textarea
        >
        <!-- Text area for Javascript Code  -->
        <textarea
          id="javascriptCode"
          spellcheck="false"
          placeholder="Type JavaScript code here"
          autocapitalize="none"
          oninput="update()"
        ></textarea
        >
      </div>
      <div class="iframe-container">
        <iframe id="viewer"></iframe>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
